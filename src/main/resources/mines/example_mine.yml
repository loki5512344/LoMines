# ============================================
# LoMines - Пример конфигурации шахты
# ============================================

# Название шахты (для отображения в сообщениях и голограммах)
# Поддерживает цвета в формате &#RRGGBB (HEX)
# Пример: &#FF0000Красная &#00FF00шахта
name: "&#FFD700Золотая шахта&#FFFFFF"

# ============================================
# РЕГИОНЫ (области спавна блоков)
# ============================================
# Можно указать несколько регионов (до 10 точек = 5 регионов)
# Каждый регион = пара точек (от угла до угла)
# Все регионы должны быть в ОДНОМ мире
#
# Формат: мир;x;y;z;yaw;pitch
# yaw/pitch можно опустить (будет 0;0)

region:
  selection:
    '1': "world;-100.0;64.0;-100.0"
    '2': "world;-90.0;74.0;-90.0"
    # Можно добавить больше регионов:
    # '3': "world;-80.0;64.0;-100.0"
    # '4': "world;-70.0;74.0;-90.0"

# ============================================
# БЛОКИ И ШАНСЫ
# ============================================
# Шансы суммируются и нормализуются автоматически
# Можно использовать материалы из Minecraft
# Для Oraxen: oraxen:id_предмета
# Для ItemsAdder: ia:id_предмета

blocks:
  contents:
    stone: 50.0
    coal_ore: 20.0
    iron_ore: 15.0
    gold_ore: 10.0
    diamond_ore: 4.0
    emerald_ore: 1.0
  
  # Режим заполнения:
  # - cuboid: заполнить весь кубоид блоками
  # - mask: только определённые позиции (см. ниже)
  fill-mode: cuboid
  
  # Для режима mask (опционально):
  # mask:
  #   marker: pink_concrete  # Блок-маркер для позиций
  #   positions: []  # Позиции будут заполнены при сканировании

# ============================================
# СБРОС ШАХТЫ
# ============================================
reset:
  # Интервал сброса
  # Форматы: 30s (секунды), 5m (минуты), 2h (часы), 1d (дни)
  interval: "10m"
  
  # Процентный триггер (сброс при % заполненности)
  # -1 или 0 = отключено
  percent-trigger: -1.0
  percent-enabled: false
  
  # Сообщение при сбросе (пусто = стандартное)
  # Поддерживает плейсхолдеры: {mine}, {time}
  broadcast: "&#00FF00Шахта &#FFFF00{mine} &#00FF00сброшена!"
  
  # Команды при сбросе (опционально)
  commands: [ ]
    # - "eco give <player> 100"
  # - "broadcast Шахта {mine} сброшена!"

# ============================================
# ТЕЛЕПОРТАЦИЯ ПРИ СБРОСЕ
# ============================================
# ИГРОКИ ТЕЛЕПОРТИРУЮТСЯ ТОЛЬКО ЕСЛИ ЗАСТРЯЛИ В БЛОКАХ!
# 
# Точка телепорта - куда телепортировать при сбросе шахты
# (только если игрок оказался внутри блока после сброса)
teleport:
  enabled: false
  location: ""  # Формат: мир;x;y;z;yaw;pitch
  
  # Точка спавна для "застрявших" игроков
  # (если игрок оказался внутри блока после сброса)
  # Если не задано - используется teleport.location
  spawn:
    enabled: false
    location: ""  # Формат: мир;x;y;z;yaw;pitch

# ============================================
# НАГРАДЫ ПРИ ДОБЫЧЕ
# ============================================
# Выдаются с определённым шансом при ломании блоков

rewards: [ ]
  # Пример награды:
  # - chance: 0.001  # 0.1% шанс
  #   prevent-drops: false  # Отменить дроп блока?
  #   blocks:  # На каких блоках работает
  #     - diamond_ore
  #     - emerald_ore
  #   items:  # Предметы (опционально)
  #     - type: diamond
  #       amount: 1
  #       name: "&#00FFFFРедкий алмаз"
  #   commands:  # Команды (опционально)
#     - "eco give <player> 1000"

# ============================================
# ИНТЕРФЕЙС (UI)
# ============================================
ui:
  # ActionBar (полоска над хотбаром)
  actionbar:
    enabled: true
    # Дистанция показа (в блоках)
    range: 50.0
    # Формат строки
    # Плейсхолдеры: {mine}, {percent}, {time}, {blocks}, {total}
    format: "&#FFD700{mine} &#AAAAAA| &#00FF00{percent}% &#AAAAAA| &#FFFF00{time}"
  
  # Голограмма над шахтой (требует HolographicDisplays или DecentHolograms)
  hologram:
    enabled: false
    # Высота голограммы от центра региона
    height: 3.0
    format:
      - "&#FFD700★ {mine} ★"
      - "&#AAAAAAЗаполнено: &#00FF00{percent}%"
      - "&#AAAAAAСброс через: &#FFFF00{time}"
  
  # Формат времени для плейсхолдеров
  # 1 = HH:MM:SS (01:25:35)
  # 2 = короткий (25m 35s)
  # 3 = текстовый (1ч 25м 35с)
  timer-format: 2

# ============================================
# WORLDGUARD ИНТЕГРАЦИЯ (опционально)
# ============================================
# Создаёт регион для защиты шахты
# Можно добавить ЛЮБЫЕ флаги WorldGuard!
worldguard:
  enabled: false
  # Шаблон названия региона
  # {mine_name} = название шахты
  # {random_4} = 4 случайных символа
  region-template: "mine_{mine_name}_{random_4}"
  
  # Владельцы региона (uuid:xxx или имя)
  owners: [ ]
  
  # Участники региона
  members: [ ]
  
  # Флаги WorldGuard. По умолчанию: только block-break=allow
  # МОЖНО ДОБАВИТЬ ЛЮБЫЕ ФЛАГИ:
  # - "block-break=allow"        # все могут ломать
  # - "block-break=deny"         # никто не может ломать
  # - "block-break=-g members"   # только владельцы/участники
  # - "pvp=deny"                 # запретить PvP
  # - "tnt=deny"                 # запретить TNT
  # - "creeper-explosion=deny"   # запретить взрывы криперов
  # - "mob-spawning=deny"        # запретить спавн мобов
  # - "use=allow"                # разрешить использование механизмов
  flags:
    - "block-break=allow"

# ============================================
# ДОПОЛНИТЕЛЬНЫЕ НАСТРОЙКИ
# ============================================

# Задержка между установкой блоков (в тиках, 20 тиков = 1 сек)
# 0 = мгновенно (может лагать на больших шахтах)
# Больше = плавнее, но медленнее
block-place-delay: 0

# Тип установки блоков:
# - fast: быстрый (рекомендуется)
# - bukkit: стандартный (медленнее, но стабильнее)
# - parallel: параллельный (экспериментально)
setter: fast

# Разрешить физику блоков (песок, гравий падают)?
block-physics: false

# Разрешить спавн сущностей в шахте?
entity-spawning: false

# Разрешить течение жидкостей?
liquid-flow: false
