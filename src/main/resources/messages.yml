# ============================================
# LoMines - Сообщения плагина
# ============================================
# Поддержка цветов: &#RRGGBB (HEX), &a..&f, <color>
# Плейсхолдеры: {player}, {mine}, {percent}, {time}, {blocks}

# ============================================
# УВЕДОМЛЕНИЯ О СБРОСЕ ШАХТ
# ============================================

# Когда шахта сброшена автоматически (по времени или проценту)
mine-reset-auto:
  # Тип уведомления: CHAT, ACTIONBAR, TITLE, BOSSBAR, NONE
  type: CHAT
  # Дистанция от центра шахты (-1 = все игроки на сервере)
  range: -1
  # Сообщение (для CHAT и ACTIONBAR)
  message: "&#00FF00[Шахты] &#FFFF00{mine} &#00FF00сброшена!"
  # Для TITLE (оставить пустым если не нужно)
  title: "&#FFFF00{mine}"
  subtitle: "&#00FF00Сброшена!"
  # Для BOSSBAR (оставить пустым если не нужно)
  bossbar: "&#FFFF00{mine} &#AAAAAA| Сброшена"
  bossbar-color: GREEN
  bossbar-style: SOLID
  # Длительность в тиках (20 = 1 секунда, только для TITLE и BOSSBAR)
  duration: 60

# Когда шахта сброшена вручную командой
mine-reset-manual:
  type: CHAT
  range: -1
  message: "&#00FF00[Шахты] &#FFFF00{mine} &#00FF00сброшена администратором!"
  title: ""
  subtitle: ""
  bossbar: ""
  bossbar-color: GREEN
  bossbar-style: SOLID
  duration: 60

# Предупреждение перед сбросом (за 60, 30, 10 секунд)
mine-reset-warning:
  enabled: true
  # За сколько секунд до сброса предупреждать
  warnings:
    - 60
    - 30
    - 10
  type: CHAT
  range: 100
  message: "&#FFAA00[Шахты] &#FFFF00{mine} &#FFAA00сбросится через &#FF0000{time}"
  title: ""
  subtitle: ""

# ============================================
# СООБЩЕНИЯ КОМАНД
# ============================================

# Создание шахты
mine-created: "&#00FF00Шахта &#FFFF00{mine} &#00FF00успешно создана!"
mine-create-error: "&#FF0000Ошибка при создании шахты: {error}"

# Удаление шахты
mine-deleted: "&#00FF00Шахта &#FFFF00{mine} &#00FF00удалена!"
mine-delete-error: "&#FF0000Ошибка при удалении шахты: {error}"

# Перезагрузка шахты  
mine-reloaded: "&#00FF00Шахта &#FFFF00{mine} &#00FF00перезагружена!"
mine-reload-error: "&#FF0000Ошибка при перезагрузке шахты: {error}"

# Перезагрузка всех шахт
mines-reloaded: "&#00FF00Все шахты перезагружены! ({count} штук)"

# Телепортация к шахте
mine-teleport: "&#00FF00Телепортировано к шахте &#FFFF00{mine}"
mine-teleport-no-location: "&#FF0000У шахты нет настроенной точки телепорта!"

# Информация о шахте
mine-info-header: "&#888888========== &#FFD700{mine} &#888888=========="
mine-info-blocks: "&#AAAAAAБлоков: &#FFFFFF{blocks}&#AAAAAA/&#FFFFFF{total} &#AAAAAA(&#FFFFFF{percent}%&#AAAAAA)"
mine-info-reset: "&#AAAAAAСледующий сброс через: &#FFFFFF{time}"
mine-info-footer: "&#888888=============================="

# ============================================
# СООБЩЕНИЯ ИГРОКАМ
# ============================================

# Когда игрок ломает блок в шахте
block-break-reward: "&#00FF00+&#FFD700{amount} &#AAAAAAза добычу блока!"

# Когда игрок получает награду из random-rewards
reward-received: "&#00FF00Вы получили награду за добычу!"

# ============================================
# ОШИБКИ
# ============================================

no-permission: "&#FF0000У вас нет прав для этой команды!"
player-only: "&#FF0000Эта команда только для игроков!"
mine-not-found: "&#FF0000Шахта не найдена: &#FFFF00{mine}"
invalid-arguments: "&#FF0000Неверные аргументы команды!"
no-selection: "&#FF0000Выделите регион палочкой! ЛКМ - 1-я точка, ПКМ - 2-я точка"
wand-given: "&#00FF00Вы получили палочку для выделения шахты!"

# ============================================
# СТАТИСТИКА
# ============================================

stats-header: "&#888888========== &#FFD700Статистика {player} &#888888=========="
stats-blocks: "&#AAAAAAБлоков добыто: &#FFFFFF{blocks}"
stats-resets: "&#AAAAAAШахт сброшено: &#FFFFFF{resets}"
stats-playtime: "&#AAAAAAВремя игры: &#FFFFFF{time}"
stats-rank: "&#AAAAAAПозиция в топе: &#FFFFFF#{rank}"
stats-footer: "&#888888======================================"

# ============================================
# ТОП ИГРОКОВ
# ============================================

top-header: "&#888888========== &#FFD700Топ по добыче &#888888=========="
top-entry: "&#FFD700#{rank} &#AAAAAA| &#FFFFFF{player} &#AAAAAA| &#FFD700{blocks} блоков"
top-footer: "&#888888======================================"
top-empty: "&#AAAAAAТоп пуст - начните добывать блоки!"
