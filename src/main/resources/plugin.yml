name: LoMines
version: ${version}
description: ${description}
main: dev.loki.lomines.LoMinesPlugin
author: loki
api-version: "1.21"
website: https://github.com/loki/lomines
softdepend: [ PlaceholderAPI, WorldGuard, Oraxen, ItemsAdder ]

commands:
  lm:
    description: Main LoMines command
    aliases: [ lomines, mine, mines ]
    permission: lomines.use
    usage: /<command> <subcommand>

permissions:
  lomines.admin:
    description: Access to all LoMines admin commands
    default: op
    children:
      lomines.use: true
      lomines.stats: true
      lomines.stats.others: true
      lomines.admin.wand: true
      lomines.admin.maskscan: true
      lomines.admin.edit: true
      lomines.admin.setteleport: true
      lomines.admin.setspawn: true
  lomines.stats:
    description: View mining stats and leaderboards (/lm stats, /lm top)
    default: true
  lomines.stats.others:
    description: View another player's stats (/lm stats player)
    default: op
  lomines.admin.maskscan:
    description: Scan marker blocks and enable mask fill mode for a mine
    default: op
  lomines.admin.wand:
    description: Group wand and /lm group prefix for batch mine creation
    default: op
  lomines.admin.edit:
    description: Open GUI editor for mines (/lm edit <mine>)
    default: op
  lomines.use:
    description: Basic LoMines usage
    default: true
  lomines.admin.setteleport:
    description: Set teleport location for mine reset (/lm setteleport <mine>)
    default: op
  lomines.admin.setspawn:
    description: Set safe spawn location for stuck players (/lm setspawn <mine>, /lm clearspawn <mine>)
    default: op
